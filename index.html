<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reisbord Relics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #1a1410;
      color: #e8dccc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 700px;
      text-align: center;
      background: #2a1f18;
      padding: 3rem 2.5rem;
      border-radius: 24px;
      border: 1px solid #b8956a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 3.2rem;
      letter-spacing: 4px;
      color: #f5e3c4;
      text-shadow: 0 0 10px #b8956a66;
      margin-bottom: 0.25rem;
    }
    .tagline {
      font-size: 1.2rem;
      color: #c9ad93;
      margin-bottom: 1.5rem;
      border-top: 1px solid #b8956a44;
      border-bottom: 1px solid #b8956a44;
      padding: 0.75rem 0;
    }
    .description {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 1.5rem 0;
      color: #d6c4b2;
    }
    .cta-button {
      display: inline-block;
      background: #b8956a;
      color: #1a1410;
      padding: 0.9rem 2.4rem;
      border-radius: 40px;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
      border: none;
      cursor: pointer;
    }
    .cta-button:hover {
      background: #d4b083;
      transform: scale(1.02);
    }
    .badge {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #a0846b;
    }
    .badge a {
      color: #c9ad93;
      text-decoration: none;
      border-bottom: 1px dotted #c9ad9355;
    }
    .badge a:hover { border-bottom: 1px solid #c9ad93; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚜️ REISBORD RELICS</h1>
    <div class="tagline">Treasure hunting for the good stuff ✨</div>
    <p class="description">
      Vintage jewelry, sterling silver, and cool finds you won’t see every day.<br />
      Come hang out, bid, and score some deals!
    </p>
    <a href="https://www.whatnot.com/user/reisbordrelics" target="_blank" class="cta-button">
      📺 Watch on Whatnot
    </a>
    <div class="badge">
      🏺 Antique jewelry &amp; sterling silver — curated by <strong>Isaac Reisbord</strong>
    </div>
  </div>
</body>
</html>
